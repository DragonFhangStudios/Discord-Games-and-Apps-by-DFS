name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # EnableWindowsTargeting lets the WPF project at the repo root build on Linux.
      - name: Build
        run: dotnet build "Discord Games and Apps by DFS.sln" -c Release -p:EnableWindowsTargeting=true

      - name: Test
        run: dotnet test "Discord Games and Apps by DFS.sln" -c Release --no-build -p:EnableWindowsTargeting=true
